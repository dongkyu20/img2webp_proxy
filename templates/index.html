<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 크기 감소량 시각화</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .stats-card {
            text-align: center;
            padding: 20px;
        }
        .reduction-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #28a745;
        }
        .total-saved {
            font-size: 1.8rem;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">이미지 크기 감소량 시각화</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card stats-card">
                    <h3>총 감소율</h3>
                    <div class="reduction-value" id="total-reduction">로딩 중...</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stats-card">
                    <h3>절약된 크기</h3>
                    <div class="total-saved" id="total-saved">로딩 중...</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stats-card">
                    <h3>처리된 이미지</h3>
                    <div class="total-saved" id="image-count">로딩 중...</div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">도메인별 감소율</div>
                    <div class="card-body">
                        <canvas id="domainChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">원본 vs WebP 크기 비교</div>
                    <div class="card-body">
                        <canvas id="sizeComparisonChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">최근 처리된 이미지</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>도메인</th>
                                        <th>경로</th>
                                        <th>원본 크기</th>
                                        <th>WebP 크기</th>
                                        <th>감소율</th>
                                        <th>처리 시간</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-images">
                                    <tr>
                                        <td colspan="6" class="text-center">로딩 중...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/charts.js"></script>
</body>
</html>
